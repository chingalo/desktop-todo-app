publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.29.0
  sqlite3: ^2.9.0
  path: ^1.9.1
  path_provider: ^2.1.5
  http: ^1.6.0
  crypto: ^3.0.7
  flutter_secure_storage: ^9.2.4
  provider: ^6.1.5
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.29.0
  build_runner: ^2.10.4

flutter:
  uses-material-design: true
