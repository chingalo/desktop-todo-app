name: windows app release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: .

jobs:
  build:
    runs-on: windows-latest
    env:
      REPO_NAME: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Integration tests
        run: flutter test integration_test/

      - name: Set Windows executable name from repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $path = "windows/CMakeLists.txt"
          $content = Get-Content $path -Raw
          $name = $env:REPO_NAME
          $content = $content -replace 'set\(BINARY_NAME "dhis_todo"\)', "set(BINARY_NAME `"$name`")"
          Set-Content $path -Value $content -NoNewline

      - name: Build Windows release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: flutter build windows --release

      - name: Upload Windows runner bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-windows
          path: build/windows/x64/runner/Release/
