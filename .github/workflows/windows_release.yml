name: windows app release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  FLUTTER_PROJECT_PATH: .

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        working-directory: ${{ env.FLUTTER_PROJECT_PATH }}
        run: flutter config --enable-windows-desktop

      - name: Dependencies
        working-directory: ${{ env.FLUTTER_PROJECT_PATH }}
        run: flutter pub get

      - name: Generate Drift code
        working-directory: ${{ env.FLUTTER_PROJECT_PATH }}
        run: dart run build_runner build

      - name: Analyze
        working-directory: ${{ env.FLUTTER_PROJECT_PATH }}
        run: flutter analyze

      - name: Test
        working-directory: ${{ env.FLUTTER_PROJECT_PATH }}
        run: flutter test

      - name: Build Windows release
        working-directory: ${{ env.FLUTTER_PROJECT_PATH }}
        run: flutter build windows --release

      - name: Upload Windows runner bundle
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-windows
          path: ${{ env.FLUTTER_PROJECT_PATH == '.' && 'build/windows/x64/runner/Release/' || format('{0}/build/windows/x64/runner/Release/', env.FLUTTER_PROJECT_PATH) }}
