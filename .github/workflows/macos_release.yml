name: macos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: .

jobs:
  build:
    runs-on: macos-latest
    env:
      REPO_NAME: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Integration tests
        run: flutter test integration_test/

      - name: Set macOS product name from repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sed -i '' "s/^PRODUCT_NAME = .*/PRODUCT_NAME = ${REPO_NAME}/" macos/Runner/Configs/AppInfo.xcconfig

      - name: Build macOS release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: flutter build macos --release

      - name: Rename .app to repository name if needed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          R="build/macos/Build/Products/Release"
          if [ -d "$R/dhis_todo.app" ] && [ "${REPO_NAME}" != "dhis_todo" ]; then
            mv "$R/dhis_todo.app" "$R/${REPO_NAME}.app"
          fi

      - name: Upload macOS app
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-macos
          path: build/macos/Build/Products/Release/${{ github.event.repository.name }}.app
