# Flutter macOS desktop build. Requires pubspec.yaml under FLUTTER_PROJECT_PATH.
# For a monorepo, set FLUTTER_PROJECT_PATH to the app folder (e.g. apps/flutter).

name: macos

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  FLUTTER_PROJECT_PATH: .

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      REPO_NAME: ${{ github.event.repository.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop
        working-directory: ${{ env.FLUTTER_PROJECT_PATH }}
        run: flutter config --enable-macos-desktop

      - name: Dependencies
        working-directory: ${{ env.FLUTTER_PROJECT_PATH }}
        run: flutter pub get

      - name: Generate Drift code
        working-directory: ${{ env.FLUTTER_PROJECT_PATH }}
        run: dart run build_runner build

      - name: Set macOS product name from repository
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
        working-directory: ${{ env.FLUTTER_PROJECT_PATH }}
        run: |
          sed -i '' "s/^PRODUCT_NAME = .*/PRODUCT_NAME = ${REPO_NAME}/" macos/Runner/Configs/AppInfo.xcconfig

      - name: Build macOS release
        working-directory: ${{ env.FLUTTER_PROJECT_PATH }}
        run: flutter build macos --release

      - name: Rename .app to repository name if needed
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
        working-directory: ${{ env.FLUTTER_PROJECT_PATH }}
        run: |
          R="build/macos/Build/Products/Release"
          if [ -d "$R/dhis_todo.app" ] && [ "${REPO_NAME}" != "dhis_todo" ]; then
            mv "$R/dhis_todo.app" "$R/${REPO_NAME}.app"
          fi

      - name: Upload macOS app
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-macos
          path: ${{ env.FLUTTER_PROJECT_PATH == '.' && format('build/macos/Build/Products/Release/{0}.app', github.event.repository.name) || format('{0}/build/macos/Build/Products/Release/{1}.app', env.FLUTTER_PROJECT_PATH, github.event.repository.name) }}
